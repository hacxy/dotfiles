# List of plugins
set -g @plugin 'tmux-plugins/tmux-sensible'  # 解决esc响应延迟问题
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tpm'
# 自定义 CPU 和内存图标
set -g @cpu_low_icon ""
set -g @cpu_medium_icon ""
set -g @cpu_high_icon ""
set -g @ram_low_icon ""
set -g @ram_medium_icon ""
set -g @ram_high_icon ""




# load tpm

# 自定义状态栏
set -g status-right "#[fg=colour75] #{cpu_icon} #{cpu_percentage} #[fg=colour75] #{ram_icon} #{ram_percentage}"

run '~/.config/tmux/plugins/tpm/tpm'
set -g status-bg default
set -g status-position top
set -g status 2
set -g status-format[1] "#[fg=colour240,bg=default]#(printf '%%0.s─' $(seq 1 $(tmux display -p '#{client_width}')))"
set -g status-justify centre
set -g window-status-separator " "
set -g window-status-format "#[fg=colour250,bg=colour236] #I "
set -g window-status-current-format "#[fg=colour0,bg=colour2,bold] #I "
set -g status-left-length 0
set -g status-left " #{?client_prefix,#[fg=colour1],#{?#{==:#{pane_mode},copy-mode},#[fg=colour3],#[fg=colour2]}} #S  #[fg=colour75] #{b:pane_current_path}"



# Base set
set -g default-terminal "tmux-256color"
set-option -ga terminal-overrides ",xterm-256color:Tc"

set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

set -g mouse on

set -g allow-passthrough on
set -s extended-keys always
set -s extended-keys-format csi-u
set -as terminal-features 'xterm*:extkeys'

# yazi image preview
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM
set -g visual-activity off

# visual mode
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

unbind C-b

set -g prefix C-a

# split current window horizontally
bind - split-window -v
# split current window vertically
bind _ split-window -h

# pane navigation
bind -r h select-pane -L  # move left
bind -r j select-pane -D  # move down
bind -r k select-pane -U  # move up
bind -r l select-pane -R  # move right

bind > swap-pane -D       # swap current pane with the next one
bind < swap-pane -U       # swap current pane with the previous one

# pane resizing
bind -r c-h resize-pane -L 2
bind -r c-j resize-pane -D 2
bind -r c-k resize-pane -U 2
bind -r c-l resize-pane -R 2

bind -n M-1 switch-client -t Onns
bind -n M-2 switch-client -t un
bind -n M-3 switch-client -t 3
bind -n M-4 switch-client -t 4
bind -n M-5 switch-client -t 5

bind -n C-1 select-window -t :1
bind -n C-2 select-window -t :2
bind -n C-3 select-window -t :3
bind -n C-4 select-window -t :4
bind -n C-5 select-window -t :5
bind -n C-6 select-window -t :6
bind -n C-7 select-window -t :7
bind -n C-8 select-window -t :8
bind -n C-9 select-window -t :9
