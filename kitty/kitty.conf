# "Nerd Fonts - Pomicons"
symbol_map  U+E000-U+E00D Symbols Nerd Font

# "Nerd Fonts - Powerline"
symbol_map U+e0a0-U+e0a2,U+e0b0-U+e0b3 Symbols Nerd Font

# "Nerd Fonts - Powerline Extra"
symbol_map U+e0a3-U+e0a3,U+e0b4-U+e0c8,U+e0cc-U+e0d2,U+e0d4-U+e0d4 Symbols Nerd Font

# "Nerd Fonts - Symbols original"
symbol_map U+e5fa-U+e62b Symbols Nerd Font

# "Nerd Fonts - Devicons"
symbol_map U+e700-U+e7c5 Symbols Nerd Font

# "Nerd Fonts - Font awesome"
symbol_map U+f000-U+f2e0 Symbols Nerd Font

# "Nerd Fonts - Font awesome extension"
symbol_map U+e200-U+e2a9 Symbols Nerd Font

# "Nerd Fonts - Octicons"
symbol_map U+f400-U+f4a8,U+2665-U+2665,U+26A1-U+26A1,U+f27c-U+f27c Symbols Nerd Font

# "Nerd Fonts - Font Linux"
symbol_map U+F300-U+F313 Symbols Nerd Font

#  Nerd Fonts - Font Power Symbols"
symbol_map U+23fb-U+23fe,U+2b58-U+2b58 Symbols Nerd Font

#  "Nerd Fonts - Material Design Icons"
symbol_map U+f500-U+fd46 Symbols Nerd Font

# "Nerd Fonts - Weather Icons"
symbol_map U+e300-U+e3eb Symbols Nerd Font

# Misc Code Point Fixes
symbol_map U+21B5,U+25B8,U+2605,U+2630,U+2632,U+2714,U+E0A3,U+E615,U+E62B Symbols Nerd Font


# tab_bar
tab_bar_margin_width        0.0
tab_bar_margin_height       0.0 0.0
tab_bar_style powerline
window_padding_width        0
active_tab_font_style       slanted
inactive_tab_font_style     normal


# window 窗口

remember_window_size  no # Always open at the configured witdth and height
initial_window_width  1024
initial_window_height 768

window_padding_width 3.0
# macos_titlebar_color background
macos_show_window_title_in all
macos_thicken_font 0.15
draw_minimal_borders yes
window_margin_width 0
window_padding_width 5
# set window opacity. Adjust this for readability, if needed.
background_opacity 0.90

# background_blur                 64
# hide_window_decorations         titlebar-only


# tmux key mapping
map cmd+1 combine : send_key ctrl+a : send_key 1
map cmd+2 combine : send_key ctrl+a : send_key 2
map cmd+3 combine : send_key ctrl+a : send_key 3
map cmd+4 combine : send_key ctrl+a : send_key 4
map cmd+5 combine : send_key ctrl+a : send_key 5
map cmd+6 combine : send_key ctrl+a : send_key 6
map cmd+7 combine : send_key ctrl+a : send_key 7
map cmd+8 combine : send_key ctrl+a : send_key 8
map cmd+9 combine : send_key ctrl+a : send_key 9


map ctrl+1 combine : send_key ctrl+a : send_key 1
map ctrl+2 combine : send_key ctrl+a : send_key 2
map ctrl+3 combine : send_key ctrl+a : send_key 3
map ctrl+4 combine : send_key ctrl+a : send_key 4
map ctrl+5 combine : send_key ctrl+a : send_key 5
map ctrl+6 combine : send_key ctrl+a : send_key 6
map ctrl+7 combine : send_key ctrl+a : send_key 7
map ctrl+8 combine : send_key ctrl+a : send_key 8
map ctrl+9 combine : send_key ctrl+a : send_key 9


# 兼容nvim键位
map ctrl+` combine : send_key ctrl+_

# map shift+space send_text all \e[32;2u  
map shift+enter send_text all \x1b[13;2u

# option 映射为 alt
macos_option_as_alt yes


# cursor 光标
cursor_blink_interval 0
detect_urls no
mouse_hide_wait 0.5


# BEGIN_KITTY_FONTS
font_family      family='JetBrainsMono Nerd Font Mono' postscript_name=JetBrainsMonoNFM-Medium
bold_font        family='JetBrainsMono Nerd Font Mono' postscript_name=JetBrainsMonoNFM-Medium
italic_font      auto
bold_italic_font auto
font_size 18.0

text_composition_strategy legacy
modify_font cell_height 1.2
modify_font cell_width 95%

include ./themes/snazzy.conf

# END_KITTY_FONTS


# BEGIN_KITTY_THEME
# Catppuccin-Mocha
include current-theme.conf
# END_KITTY_THEME
